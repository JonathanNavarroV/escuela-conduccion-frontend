<div class="sidenav-header text-center">
	<img
		class="rounded-circle"
		[width]="profileImgSize()"
		[height]="profileImgSize()"
		src="../../../../../assets/images/user-default.png"
		alt="Rounded circle"
	/>
	<div class="header-text" [class.hide-header-text]="collapsed()">
		<h2>Jonathan Damián Navarro Vegajajaja</h2>
		<p>Yout name</p>
	</div>
</div>
<mat-nav-list class="sidenav-list">
	<!-- `#rla`: Se crea una referencia local `rla` al estado del routerLinkActive. -->
	<a
		mat-list-item
		*ngFor="let item of menuItems"
		[routerLink]="item.route"
		routerLinkActive
		#rla="routerLinkActive"
		[activated]="rla.isActive"
	>
		<mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
		<span *ngIf="!collapsed()" matListItemTitle>{{ item.label }}</span>
	</a>
</mat-nav-list>
