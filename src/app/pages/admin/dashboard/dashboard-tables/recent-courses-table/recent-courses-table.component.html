<div class="recent-courses-table">
	<table mat-table [dataSource]="recentCourses">
		<!-- Curso -->
		<ng-container matColumnDef="courseName">
			<th mat-header-cell *matHeaderCellDef>Curso</th>
			<td mat-cell *matCellDef="let element">{{ element.courseName }}</td>
		</ng-container>

		<!-- Monto -->
		<ng-container matColumnDef="saleAmount">
			<th mat-header-cell *matHeaderCellDef>Monto</th>
			<td mat-cell *matCellDef="let element">
				{{
					element.saleAmount | currency: "CLP" : "symbol" : "1.0-0" : "es-CL"
				}}
			</td>

			<!-- Fecha de venta -->
			<ng-container matColumnDef="soldDate">
				<th mat-header-cell *matHeaderCellDef>Fecha de venta</th>
				<td mat-cell *matCellDef="let element">
					{{ element.soldDate | date: "dd/MM/yyyy" }}
				</td>
			</ng-container>

			<!-- Email del usuario -->
			<ng-container matColumnDef="userEmail">
				<th mat-header-cell *matHeaderCellDef>Usuario</th>
				<td mat-cell *matCellDef="let element">{{ element.userEmail }}</td>
			</ng-container>
		</ng-container>

		<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
		<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
	</table>
</div>
