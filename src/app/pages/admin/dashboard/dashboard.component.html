<div class="row">
	<div class="col-sm-12 col-md-6 col-xl-3">
		<mat-card class="kpi-card mat-elevation-z4">
			<mat-card-header>
				<div mat-card-avatar class="kpi-icon">
					<mat-icon color="primary">shopping_cart</mat-icon>
				</div>
				<mat-card-title>Ventas del día</mat-card-title>
				<mat-card-subtitle>Últimas 24 horas</mat-card-subtitle>
			</mat-card-header>

			<mat-card-content>
				<h2 class="kpi-value">$12.500</h2>
			</mat-card-content>
		</mat-card>
	</div>

	<div class="col-sm-12 col-md-6 col-xl-3">
		<mat-card class="kpi-card mat-elevation-z4">
			<mat-card-content>
				<div class="w-100 d-flex align-items-center justify-content-between">
					<div class="kpi-text">
						<h2>$10.232.500</h2>
						<p>Últimas 24 horas</p>
					</div>
					<div mat-card-avatar class="kpi-icon">
						<mat-icon class="text-primary">shopping_cart</mat-icon>
					</div>
				</div>
			</mat-card-content>
		</mat-card>
	</div>
</div>

<div echarts [options]="chartOption" class="demo-chart"></div>
