<div class="d-flex flex-column gap-4 align-items-center">
	<!-- Header -->
	<div class="row w-100">
		<div class="col-6">
			<h2>Resumen general</h2>
		</div>
		<div class="col-6 text-end">
			<mat-form-field appearance="outline">
				<mat-label>Rango de tiempo</mat-label>
				<mat-select [(value)]="selectedRange">
					<ng-container *ngFor="let group of timeRangeGroups">
						<mat-optgroup [label]="group">
							<mat-option
								*ngFor="let opt of getOptionsByGroup(group)"
								[value]="opt.value"
							>
								{{ opt.label }}</mat-option
							>
						</mat-optgroup>
					</ng-container>
				</mat-select>
			</mat-form-field>
		</div>
	</div>

	<!-- Contenido -->
	<div class="dashboard-content row w-100">
		<div class="col-12">
			<app-dashboard-kpis></app-dashboard-kpis>
		</div>
	</div>
	<div class="dashboard-content row w-100">
		<div class="col-12">
			<app-dashboard-tables></app-dashboard-tables>
		</div>
	</div>
</div>
