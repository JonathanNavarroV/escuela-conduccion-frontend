<div class="d-flex flex-column gap-4 align-items-center">
	<!-- Header -->
	<div class="w-100">
		<h2>Usuarios</h2>
	</div>

	<!-- Contenido -->
	<div class="users-content w-100">
		<div class="mat-elevation-z8 p-4">
			<!-- Buscador -->
			<div class="d-flex justify-content-between">
				<mat-form-field appearance="outline">
					<mat-label>Buscar</mat-label>
					<input matInput type="search" (input)="getUsersByFullName($event)" />
					<button matPrefix mat-icon-button>
						<mat-icon>search</mat-icon>
					</button>
				</mat-form-field>
				<button mat-icon-button (click)="openCreateUserDialog()">
					<mat-icon>person_add</mat-icon>
				</button>
			</div>

			<!-- Tabla -->
			<table mat-table [dataSource]="users">
				<!-- Usuario -->
				<ng-container matColumnDef="user">
					<th mat-header-cell *matHeaderCellDef>Usuario</th>
					<td mat-cell *matCellDef="let element">
						<img class="user-photo rounded-circle" [src]="element.photo" />
						{{ element.firstName }} {{ element.lastNameFather }}
						{{ element.lastNameMother }}
					</td>
				</ng-container>

				<!-- Email -->
				<ng-container matColumnDef="email">
					<th mat-header-cell *matHeaderCellDef>Email</th>
					<td mat-cell *matCellDef="let element">{{ element.email }}</td>
				</ng-container>

				<!-- Rol del usuario -->
				<ng-container matColumnDef="role">
					<th mat-header-cell *matHeaderCellDef>Rol del usuario</th>
					<td mat-cell *matCellDef="let element">{{ element.role }}</td>
				</ng-container>

				<!-- Acciones -->
				<ng-container matColumnDef="actions">
					<th mat-header-cell *matHeaderCellDef></th>
					<td mat-cell *matCellDef="let element">
						<button mat-icon-button [matMenuTriggerFor]="menu">
							<mat-icon>more_horiz</mat-icon>
						</button>
						<mat-menu #menu="matMenu">
							<button mat-menu-item>
								<mat-icon>edit</mat-icon>
								<span>Editar</span>
							</button>
							<button mat-menu-item>
								<mat-icon>delete</mat-icon>
								<span>Eliminar</span>
							</button>
						</mat-menu>
					</td>
				</ng-container>

				<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
				<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
			</table>

			<!-- Paginador -->
			<mat-paginator
				[pageSizeOptions]="[5, 10, 20]"
				showFirstLastButtons
			></mat-paginator>
		</div>
	</div>
</div>
