<h2 mat-dialog-title class="m-0">Crear usuario</h2>
<mat-dialog-content>
	<div class="row g-3">
		<div class="col-12">
			<mat-form-field class="w-100">
				<mat-label>Nombres</mat-label>
				<input matInput type="text" />
			</mat-form-field>
		</div>

		<div class="col-6">
			<mat-form-field class="w-100">
				<mat-label>Apellido paterno</mat-label>
				<input matInput type="text" />
			</mat-form-field>
		</div>

		<div class="col-6">
			<mat-form-field class="w-100">
				<mat-label>Apellido materno</mat-label>
				<input matInput type="text" />
			</mat-form-field>
		</div>

		<div class="col-6">
			<mat-form-field class="w-100">
				<mat-label>Email</mat-label>
				<input matInput type="email" />
			</mat-form-field>
		</div>

		<div class="col-6">
			<mat-form-field class="w-100">
				<mat-label>Contraseña</mat-label>
				<input matInput type="password" />
			</mat-form-field>
		</div>

		<div class="col-6">
			<mat-form-field class="w-100">
				<mat-label>Rol</mat-label>
				<mat-select [(ngModel)]="selectedRole">
					<mat-option *ngFor="let role of roles" [value]="role">{{
						role
					}}</mat-option>
				</mat-select>
			</mat-form-field>
		</div>

		<div class="col-6">
			<mat-form-field class="w-100">
				<mat-label>Sedes</mat-label>
				<input matInput type="text" />
			</mat-form-field>
		</div>

		<div class="col-12">
			<mat-form-field class="w-100">
				<mat-label>Imagen Url</mat-label>
				<input matInput type="text" />
			</mat-form-field>
		</div>
	</div>
</mat-dialog-content>
<mat-dialog-actions>
	<button mat-button mat-dialog-close>Cancelar</button>
	<button mat-button [mat-dialog-close]="true" cdkFocusInitial>Crear</button>
</mat-dialog-actions>
