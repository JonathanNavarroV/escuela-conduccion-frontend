<div
	class="position-relative z-1 d-flex align-items-center justify-content-center h-100"
>
	<!-- Spinner -->
	<div *ngIf="isLoading" class="spinner-overlay">
		<mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
	</div>
	<div class="bg-image"></div>
	<!-- Form -->
	<div class="login-container">
		<mat-card class="p-3">
			<mat-card-title>
				<div class="p-3 pb-4 text-center">Inicio de sesión</div>
			</mat-card-title>
			<mat-card-content>
				<form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
					<div class="pb-3">
						<span>Inicia sesión con tu cuenta</span>
					</div>
					<!-- Email -->
					<mat-form-field appearance="outline" class="w-100">
						<mat-label>Email</mat-label>
						<input matInput formControlName="email" type="email" />
						<mat-error *ngIf="loginForm.get('email')?.hasError('required')"
							>Campo requerido</mat-error
						>
						<mat-error *ngIf="loginForm.get('email')?.hasError('email')"
							>Email inválido</mat-error
						>
					</mat-form-field>
					<!-- Password -->
					<mat-form-field appearance="outline" class="w-100">
						<mat-label>Contraseña</mat-label>
						<input
							matInput
							formControlName="password"
							[type]="passwordVisibility() ? 'password' : 'text'"
						/>
						<button
							mat-icon-button
							matSuffix
							type="button"
							(click)="togglePasswordVisibility($event)"
							[attr.aria-label]="'Hide password'"
							[attr.aria-pressed]="passwordVisibility()"
						>
							<mat-icon>{{
								passwordVisibility() ? "visibility_off" : "visibility"
							}}</mat-icon>
						</button>
						<mat-error *ngIf="loginForm.get('password')?.hasError('required')"
							>Campo requerido</mat-error
						>
						<mat-error *ngIf="loginForm.get('password')?.hasError('minlength')"
							>La contraseña debe tener al menos
							{{
								loginForm.get("password")?.errors?.["minlength"]?.requiredLength
							}}
							caracteres.</mat-error
						>
					</mat-form-field>
					<!-- Remember me -->
					<mat-checkbox formControlName="rememberMe" class="pb-3">
						Mantener sesión iniciada
					</mat-checkbox>
					<!-- Submit button -->
					<button
						mat-stroked-button
						[disabled]="loginForm.invalid"
						class="w-100"
					>
						Iniciar sesión
					</button>
				</form>
			</mat-card-content>
		</mat-card>
	</div>
</div>
