<h2 mat-dialog-title class="m-0">{{ data.title }}</h2>
<mat-dialog-content>
	<p>{{ data.message }}</p>
</mat-dialog-content>
<mat-dialog-actions>
	<button mat-button mat-dialog-close color="warn">Cancelar</button>
	<button mat-button (click)="onConfirmClick()">Confirmar</button>
</mat-dialog-actions>
