<div class="mat-elevation-z8 p-4">
	<!-- Buscador + Acciones-->
	<div class="d-flex justify-content-between">
		<!-- Buscador -->
		<mat-form-field appearance="outline">
			<mat-label>{{ searchPlaceholder || "Buscar" }}</mat-label>
			<input matInput type="search" (input)="onSearchChanged($event)" />
			<button matPrefix mat-icon-button>
				<mat-icon>search</mat-icon>
			</button>
		</mat-form-field>

		<!-- Acciones de cabecera -->
		<div>
			<ng-container *ngIf="headerActionsTemplate">
				<ng-container [ngTemplateOutlet]="headerActionsTemplate"></ng-container>
			</ng-container>
		</div>
	</div>

	<!-- Tabla -->
	<table mat-table [dataSource]="dataSource">
		<!-- Columnas dinámicas -->
		<ng-container *ngFor="let column of columns" [matColumnDef]="column.def">
			<th mat-header-cell *matHeaderCellDef>
				{{ column.header }}
			</th>
			<td mat-cell *matCellDef="let element">
				<!-- Usa template si existe -->
				<ng-container
					*ngIf="customTemplates[column.def]; else defaultCell"
					[ngTemplateOutlet]="customTemplates[column.def]"
					[ngTemplateOutletContext]="{ $implicit: element }"
				>
				</ng-container>

				<ng-template #defaultCell>
					{{ element[column.def] }}
				</ng-template>
			</td>
		</ng-container>

		<tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
		<tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
	</table>

	<!-- Paginador -->
	<mat-paginator
		[pageSizeOptions]="[5, 10, 20]"
		showFirstLastButtons
	></mat-paginator>
</div>
